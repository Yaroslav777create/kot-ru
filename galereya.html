<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Кошачья голерея</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
            * {
                margin: 0;
                padding: 0;
                font-family: "Roboto", sans-serif;
            }
            body {
                background-color: #13BDAC;
            }
            header {
                background-color: #FCBA03;
                padding: 35px 0;
                width: 100%;
            }
            .head-site__in_header {
                text-align: center;
                font-size: 50px;
                color: #fff;
            }
            .head-site__in_header2 {
                text-align: center;
                font-size: 30px;
                color: #fff;
                gap: 20px;
            }
            nav {
                display: flex;
                justify-content: center;
                gap: 25px;
                margin-top: 55px;
                position: sticky;
                top: 5px;
                background-color: #13bdac83;
            }
            a {
                text-decoration: none;
                color: #fff;
                background-color: #FCBA03;
                padding: 10px 20px;
                border-radius: 20px;
            }
            a:hover {
                background-color: #fff;
                color: #FCBA03;
                transition: 0.7s;
            }
            p{
                padding: 10px;
            }
            .one {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 50px;
            }
            .two {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 50px;
            }
            nav {
                display: flex;
                justify-content: center;
                margin-top: 35px;
            }
            a {
                text-decoration: none;
                color: #fff;
                background-color: #FCBA03;
                padding: 10px 20px;
                border-radius: 5px;
                gap: 20px;
                text-align: center;
            }
            a:hover {
                background-color: #fff;
                color: #FCBA03;
                transition: 0.7s;
            }
            img{
                border-radius: 20px;
            }

/* ОБЩАЯ АДАПТАЦИЯ */
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

img {
    max-width: 100%;
    height: auto;
    object-fit: cover;
}

/* ПЛАНШЕТЫ И НЕБОЛЬШИЕ НОУТБУКИ */
@media (max-width: 1200px) {
    .head-site__in_header {
        font-size: 42px;
    }

    .head-site__in_header2 {
        font-size: 25px;
    }

    .one, .two {
        padding: 0 20px;
        gap: 15px;
    }

    .one img {
        width: calc(50% - 10px);
        height: auto;
    }

    .two img {
        width: calc(50% - 10px);
        height: auto;
    }
}

/* ПЛАНШЕТЫ */
@media (max-width: 768px) {
    header {
        padding: 28px 15px;
    }

    .head-site__in_header {
        font-size: 34px;
    }

    .head-site__in_header2 {
        font-size: 21px;
    }

    .one, .two {
        margin-top: 30px;
        gap: 12px;
        padding: 0 15px;
    }

    nav {
        margin-top: 25px;
        gap: 10px;
        padding: 0 12px;
    }

    nav a {
        padding: 9px 16px;
        font-size: 15px;
    }

    footer p {
        font-size: 14px;
        text-align: center;
    }
}

/* ТЕЛЕФОНЫ */
@media (max-width: 480px) {
    header {
        padding: 22px 12px;
    }

    .head-site__in_header {
        font-size: 27px;
    }

    .head-site__in_header2 {
        font-size: 17px;
        margin-top: 10px;
    }

    .one, .two {
        flex-direction: column;
        align-items: center;
        margin-top: 22px;
        padding: 0 12px;
        gap: 15px;
    }

    .one img, .two img {
        width: 100%;
        max-width: 100%;
        height: auto;
        border-radius: 14px;
    }

    nav {
        margin-top: 22px;
    }

    nav a {
        padding: 8px 14px;
        font-size: 13px;
        border-radius: 8px;
    }

    footer p {
        padding: 12px 8px;
        font-size: 12px;
    }
}

/* ОЧЕНЬ МАЛЕНЬКИЕ ТЕЛЕФОНЫ */
@media (max-width: 360px) {
    .head-site__in_header {
        font-size: 23px;
    }

    .head-site__in_header2 {
        font-size: 15px;
    }

    nav a {
        padding: 7px 11px;
        font-size: 12px;
    }
}

            </style>
    </head>
    <body>
        <header>
            <h1 class="head-site__in_header">Галерея котов</h1>
            <h1 class="head-site__in_header2">Здесь буду выкладывать фото про котов</h1>
        </header>
        <main>
            <article class="one">
                <img src="Драка.jpeg" alt="Драка котов" width="700" height="450">
                <img src="Мейнкун и точилка.jpeg" alt="Мейнкун и точилка" width="700" height="450">
            </article>
            <article class="two">
                <img src="Кот на машине 2.jpeg" alt="Кот на машине" width="500" height="750">
                <img src="Кот на диване.jpeg" alt="Кот на диване" width="500" height="750">
            </article>
        </main>
        <footer>
        <nav>
            <a href="index.html">На главную</a>
        </nav>
            <p>&copy; 2026 Сайт про котов. Все права защищены.</p>
        </footer>
</body>        
</html>
