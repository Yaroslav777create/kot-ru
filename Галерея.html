
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея моего кота</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Roboto", sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #13BDAC;
        }

        header {
            background-color: #FCBA03;
            padding: 35px 15px;
            width: 100%;
            text-align: center;
        }

        .head-site__in_header {
            font-size: 50px;
            color: #fff;
        }

        .head-site__in_header2 {
            font-size: 30px;
            color: #fff;
            margin-top: 10px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background-color: #FCBA03;
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
            transition: 0.3s;
        }

        a:hover {
            background-color: #fff;
            color: #FCBA03;
        }

        p {
            padding: 10px;
        }

        .perecluchatel {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            padding: 0 15px;
        }

        nav {
            display: flex;
            justify-content: center;
            margin-top: 35px;
            padding: 0 15px;
        }

        .gal1,
        .gal2,
        .last_foto {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding: 0 15px;
            width: 100%;
        }

        img {
            display: block;
            width: 500px;
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            object-fit: contain;
        }

        footer p {
            text-align: center;
            font-size: 16px;
            margin-top: 15px;
        }

        /* Маленькие ноутбуки и экраны */
        @media (max-width: 1200px) {
            .head-site__in_header {
                font-size: 42px;
            }

            .head-site__in_header2 {
                font-size: 25px;
            }

            .gal1,
            .gal2,
            .last_foto {
                gap: 18px;
                margin-top: 25px;
            }

            .gal1 img,
            .gal2 img,
            .last_foto img {
                width: calc(50% - 9px);
                max-height: 550px;
            }
        }

        /* Планшеты */
        @media (max-width: 768px) {
            header {
                padding: 28px 12px;
            }

            .head-site__in_header {
                font-size: 34px;
            }

            .head-site__in_header2 {
                font-size: 21px;
            }

            .perecluchatel {
                gap: 12px;
            }

            .perecluchatel a {
                padding: 9px 15px;
                font-size: 15px;
            }

            .gal1,
            .gal2,
            .last_foto {
                gap: 12px;
                margin-top: 20px;
                padding: 0 10px;
            }

            .gal1 img,
            .gal2 img,
            .last_foto img {
                width: calc(50% - 6px);
                max-height: 420px;
                border-radius: 15px;
            }

            nav a {
                padding: 9px 15px;
                font-size: 15px;
            }

            footer p {
                font-size: 14px;
            }
        }

        /* Телефоны */
        @media (max-width: 480px) {
            header {
                padding: 22px 10px;
            }

            .head-site__in_header {
                font-size: 27px;
            }

            .head-site__in_header2 {
                font-size: 17px;
                line-height: 1.4;
            }

            .perecluchatel {
                gap: 10px;
                margin-top: 15px;
                padding: 0 10px;
            }

            .perecluchatel a {
                padding: 8px 12px;
                font-size: 13px;
                border-radius: 5px;
            }

            .gal1,
            .gal2,
            .last_foto {
                flex-direction: column;
                gap: 12px;
                margin-top: 18px;
                padding: 0 12px;
            }

            .gal1 img,
            .gal2 img,
            .last_foto img {
                width: 100%;
                max-width: 500px;
                max-height: none;
                height: auto;
                border-radius: 15px;
            }

            nav {
                margin-top: 25px;
            }

            nav a {
                padding: 8px 13px;
                font-size: 13px;
            }

            footer p {
                font-size: 12px;
                padding: 10px 5px;
            }
        }

        /* Очень маленькие телефоны */
        @media (max-width: 360px) {
            header {
                padding: 18px 8px;
            }

            .head-site__in_header {
                font-size: 23px;
            }

            .head-site__in_header2 {
                font-size: 15px;
            }

            .perecluchatel {
                gap: 7px;
            }

            .perecluchatel a {
                padding: 7px 10px;
                font-size: 12px;
            }

            .gal1,
            .gal2,
            .last_foto {
                gap: 9px;
                margin-top: 15px;
                padding: 0 8px;
            }

            .gal1 img,
            .gal2 img,
            .last_foto img {
                border-radius: 12px;
            }

            nav a {
                padding: 7px 11px;
                font-size: 12px;
            }

            footer p {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="head-site__in_header">Мой кот 🐱</h1>
        <h1 class="head-site__in_header2">Знакомьтесь с моим пушистым другом!</h1>
    </header>

    <main>
        <article class="perecluchatel">
            <a href="cat.html">Информация</a>
            <a href="Галерея.html">Галерея моего кота</a>
        </article>

        <article class="gal1">
            <img src="Сажик 1.jpeg" alt="Сажик 1" width="500" height="650">
            <img src="Сажик 2.jpeg" alt="Сажик 2" width="500" height="650">
        </article>

        <article class="gal2">
            <img src="Грызун.jpeg" alt="Грызун" width="500" height="650">
            <img src="Маленький сажик.jpeg" alt="Маленький Сажик" width="500" height="650">
        </article>

        <article class="last_foto">
            <img src="Певец.jpeg" alt="Певец" width="500" height="650">
            <img src="Сажик и тряпки.jpeg" alt="Сажик и тряпки" width="500" height="650">
        </article>
    </main>

    <footer>
        <nav>
            <a href="index.html">На главную</a>
        </nav>

        <p>&copy; 2026 Сайт про котов. Все права защищены.</p>
    </footer>
</body>
</html>
